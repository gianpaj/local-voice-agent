[project]
name = "local-voice-agent"
version = "0.1.0"
description = "Private English voice agent with Parakeet, Ollama, and Phonon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pipecat-ai[webrtc,silero,ollama]==1.15.0",
  "ptts==0.5.0",
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "numpy>=2.0,<3",
  "httpx==0.28.1",
  "python-dotenv==1.2.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
browser = ["playwright==1.64.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
